# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build and Test

on:
  push:
    branches: 
      - '**'
  pull_request:
    branches: [ master, dev ]

env:
  NUMBA_DISABLE_JIT: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install flake8
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=80 --statistics

  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install Visual C++ redistributable (Windows) 
      if:  matrix.os == 'windows-latest' 
      run: choco install -y vcredist-all
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install scikit-build cmake ninja pybind11 setuptools wheel # Build tools
        pip install pytest codecov pytest-cov # Testing tools
        pip install --no-cache-dir --upgrade --force-reinstall -r requirements.txt 
    - name: Test with pytest
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        pytest --cov-report=xml --cov=ukat
    - name: Test with pytest (skipping ukat.data tests)
      # Avoids downloading every copy of the example data and being rate limited
      if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
      run: |
        pytest --cov-report=xml --cov=ukat --ignore=ukat/data/tests
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
